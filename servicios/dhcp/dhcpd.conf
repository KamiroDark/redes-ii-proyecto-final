# Servidor DHCP - Bloque 1 (RIP) - Proyecto Redes II
# IP fija del servidor: 192.168.10.2 (VLAN 10)
# Rangos .100-.200 para no chocar con las IPs fijas de la topologia

authoritative;
default-lease-time 3600;
max-lease-time 7200;
option domain-name "pamplona.local";
option domain-name-servers 192.168.20.3;

# VLAN 10 - Usuarios (red local del servidor)
subnet 192.168.10.0 netmask 255.255.255.0 {
  range 192.168.10.100 192.168.10.200;
  option routers 192.168.10.1;
}

# VLAN 20 - DNS (via DHCP relay en R2)
subnet 192.168.20.0 netmask 255.255.255.0 {
  range 192.168.20.100 192.168.20.200;
  option routers 192.168.20.1;
}

# VLAN 30 - Web (via DHCP relay en R2)
subnet 192.168.30.0 netmask 255.255.255.0 {
  range 192.168.30.100 192.168.30.200;
  option routers 192.168.30.1;
}

# VLAN 40 - Admin (via DHCP relay en R2)
subnet 192.168.40.0 netmask 255.255.255.0 {
  range 192.168.40.100 192.168.40.200;
  option routers 192.168.40.1;
}

# VLAN 15 - LAN de S3 / PC20 (via DHCP relay en S3)
subnet 192.168.15.0 netmask 255.255.255.0 {
  range 192.168.15.100 192.168.15.200;
  option routers 192.168.15.1;
}
